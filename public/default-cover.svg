<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="120"  cy="-20" r="220" fill="url(#glow1)"/>
  <circle cx="1100" cy="430" r="280" fill="url(#glow2)"/>
  <circle cx="600"  cy="200" r="300" fill="rgba(255,255,255,0.03)"/>

  <!-- Geometric rings -->
  <circle cx="600" cy="200" r="160" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="600" cy="200" r="230" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Star shapes -->
  <polygon points="100,160 112,192 148,192 120,212 130,244 100,224 70,244 80,212 52,192 88,192"
           fill="rgba(255,255,255,0.12)"/>
  <polygon points="1090,70 1099,95 1127,95 1104,112 1113,138 1090,121 1067,138 1076,112 1053,95 1081,95"
           fill="rgba(255,255,255,0.12)"/>
  <polygon points="300,310 307,330 328,330 311,342 318,363 300,350 282,363 289,342 272,330 293,330"
           fill="rgba(255,255,255,0.08)"/>
  <polygon points="920,50 925,66 942,66 929,76 934,92 920,82 906,92 911,76 898,66 915,66"
           fill="rgba(255,255,255,0.08)"/>

  <!-- Center text -->
  <text x="600" y="185"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="52" font-weight="700" letter-spacing="-1"
        text-anchor="middle" fill="rgba(255,255,255,0.95)">Тусовка</text>
  <text x="600" y="236"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="20" font-weight="400" letter-spacing="2"
        text-anchor="middle" fill="rgba(255,255,255,0.55)">ПЛАТФОРМА ПОДІЙ</text>
</svg>
